name: Kai documentation index health

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: kai-doc-search-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/ai-search.mjs health
        env:
          AI_SEARCH_API_TOKEN: ${{ secrets.AI_SEARCH_API_TOKEN }}
